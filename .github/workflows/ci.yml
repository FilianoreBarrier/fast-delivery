name: FastDelivery CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_delivery_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/test_delivery_db
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/test_delivery_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_super_secret_test_key_for_github_actions
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python 3.11 и кэшируем pip для быстрой сборки
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # 3. Устанавливаем зависимости проекта
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # 4. Проверяем, что миграции Alembic применяются без ошибок
      - name: Run Alembic migrations
        working-directory: ./backend
        run: alembic upgrade head

      # 5. Запускаем ваши автотесты pytest
      - name: Run Pytest
        working-directory: ./backend
        run: pytest -v

      # 6. Проверяем, что Docker-образ собирается без ошибок
      - name: Build Docker image
        run: docker build -t fast-delivery-backend:test ./backend
